{{- $registry := dict }}
{{- if .Values.stores }}
{{- if not .Values.server }}
{{- fail "server is required before any store renders — a store that cannot reach OpenBAO is noise, and one that cannot verify it is worse" }}
{{- end }}
{{- if not .Values.caBundle }}
{{- fail "caBundle is required — without it External Secrets cannot verify the server it is about to send a token to" }}
{{- end }}
{{- end }}
{{- range $store := .Values.stores }}
{{- if not $store.name }}{{- fail "every entry of stores needs a name" }}{{- end }}
{{- $role := $store.role | default $store.name }}
{{- include "consumers.claim" (dict "registry" $registry "kind" "ClusterSecretStore" "name" (printf "%s-%s" $store.name $.Values.storeSuffix) "by" (printf "stores.%s" $store.name)) }}
{{- include "consumers.requireConditions" (dict "conditions" $store.conditions "by" (printf "stores.%s" $store.name)) }}
---
{{- /* One store per kind. The store's OpenBAO role carries the same name,
       so the policy that bounds what this store may read is findable from
       the store and nowhere else. */}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ printf "%s-%s" $store.name $.Values.storeSuffix }}
  {{- with include "consumers.annotations" (dict "root" $ "extra" $store.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  conditions:
    {{- toYaml $store.conditions | nindent 4 }}
  provider:
    {{- include "consumers.vaultProvider" (dict
          "root" $
          "namespace" ($store.vaultNamespace | default $.Values.vaultNamespace)
          "mount" (include "consumers.authMount" $)
          "role" $role
          "sa" $.Values.auth.serviceAccount.name
          "saNamespace" $.Values.auth.serviceAccount.namespace) | nindent 4 }}
{{- end }}
{{- range $writer := .Values.writers }}
{{- if not $writer.name }}{{- fail "every entry of writers needs a name" }}{{- end }}
{{- if not $writer.serviceAccount }}
{{- fail (printf "writers.%s needs serviceAccount — a writer store presents the WRITER's own token, never the shared one" $writer.name) }}
{{- end }}
{{- if not $writer.namespace }}
{{- fail (printf "writers.%s needs namespace — the Kubernetes namespace its ServiceAccount lives in" $writer.name) }}
{{- end }}
{{- if not $writer.environments }}
{{- fail (printf "writers.%s has no environments — a writer that writes nowhere should not be declared" $writer.name) }}
{{- end }}
{{- range $env := $writer.environments }}
{{- include "consumers.claim" (dict "registry" $registry "kind" "ClusterSecretStore" "name" (printf "%s-%s" $writer.name $env) "by" (printf "writers.%s" $writer.name)) }}
---
{{- /* A writer store is for PushSecrets, never ExternalSecrets, and it
       presents the writer's OWN ServiceAccount token — so no other store
       on this cluster can write through it.

       Note the asymmetry, which is the whole design: the auth mount is
       the HOSTING cluster's, while the Vault namespace is the TARGET
       environment's. One identity, minted here, admitted there. */}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ printf "%s-%s" $writer.name $env }}
  {{- with include "consumers.annotations" (dict "root" $ "extra" $writer.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  conditions:
    - namespaces:
        - {{ $writer.namespace | quote }}
  provider:
    {{- include "consumers.vaultProvider" (dict
          "root" $
          "namespace" $env
          "mount" ($.Values.writerAuthMount | default (include "consumers.authMount" $))
          "role" $writer.name
          "sa" $writer.serviceAccount
          "saNamespace" $writer.namespace) | nindent 4 }}
{{- end }}
{{- end }}
{{- $mode := .Values.aws.identity }}
{{- if and (or .Values.awsStores .Values.awsWriters) (not $mode) }}
{{- fail "aws.identity is required with awsStores and awsWriters: podIdentity or webIdentity. There is no default: the modes are mutually exclusive on a cluster, because a controller identity beside per-store identities is one any store without auth borrows" }}
{{- end }}
{{- range $store := .Values.awsStores }}
{{- if not $store.name }}{{- fail "every entry of awsStores needs a name" }}{{- end }}
{{- if not $store.region }}
{{- fail (printf "awsStores.%s needs region — the region of the parameters it reads" $store.name) }}
{{- end }}
{{- if not $store.role }}
{{- fail (printf "awsStores.%s needs role — the grant's reader role in the parameters' account" $store.name) }}
{{- end }}
{{- include "consumers.claim" (dict "registry" $registry "kind" "ClusterSecretStore" "name" $store.name "by" (printf "awsStores.%s" $store.name)) }}
{{- include "consumers.requireConditions" (dict "conditions" $store.conditions "by" (printf "awsStores.%s" $store.name)) }}
{{- $ref := dict }}
{{- if eq $mode "podIdentity" }}
{{- if $store.auth }}
{{- fail (printf "awsStores.%s has auth, but aws.identity is podIdentity — in this mode every store reads as the controller's own Pod Identity, and per-store auth beside it is the mix the two modes exclude; switch the cluster to webIdentity or drop auth" $store.name) }}
{{- end }}
{{- if $store.serviceAccount }}
{{- fail (printf "awsStores.%s has serviceAccount, but aws.identity is podIdentity — a store in this mode has no ServiceAccount of its own" $store.name) }}
{{- end }}
{{- else }}
{{- $ref = dig "jwt" "serviceAccountRef" dict ($store.auth | default dict) }}
{{- if not $ref }}
{{- fail (printf "awsStores.%s has no auth.jwt.serviceAccountRef, but aws.identity is webIdentity — every store names its own ServiceAccount; without one External Secrets falls back to whatever ambient credentials it finds" $store.name) }}
{{- end }}
{{- include "consumers.claim" (dict "registry" $registry "kind" "ServiceAccount" "namespace" $ref.namespace "name" $ref.name "by" (printf "awsStores.%s" $store.name)) }}
{{- $sa := $store.serviceAccount | default dict }}
{{- if (hasKey $sa "create" | ternary $sa.create true) }}
---
{{- /* The store's own identity: its token, minted by External Secrets,
       is what the reader role trusts (sub = this ServiceAccount). No pod
       runs as it, so it mounts no token. */}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $ref.name }}
  namespace: {{ $ref.namespace }}
  annotations:
    {{- $fixed := dict "eks.amazonaws.com/role-arn" $store.role "eks.amazonaws.com/audience" $.Values.aws.webIdentity.audience }}
    {{- mergeOverwrite (deepCopy ($.Values.commonAnnotations | default dict)) ($sa.annotations | default dict) $fixed | toYaml | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
{{- end }}
---
{{- /* One store per (cluster, grant): AWS Parameter Store in the account
       that holds the parameters, read through the one reader role the
       grant made there. podIdentity: External Secrets assumes `role` with
       its controller's own credentials, and the store names no auth.
       webIdentity: the store names its own ServiceAccount, whose
       annotation carries the role; a store-level role would be assumed on
       top of it, so there is none. docs/esoaws.md. */}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $store.name }}
  {{- with include "consumers.annotations" (dict "root" $ "extra" $store.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  conditions:
    {{- toYaml $store.conditions | nindent 4 }}
  provider:
    aws:
      service: ParameterStore
      region: {{ $store.region | quote }}
      {{- if eq $mode "podIdentity" }}
      role: {{ $store.role | quote }}
      {{- else }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ $ref.name | quote }}
            namespace: {{ $ref.namespace | quote }}
      {{- end }}
{{- end }}
{{- range $w := .Values.awsWriters }}
{{- if not $w.name }}{{- fail "every entry of awsWriters needs a name" }}{{- end }}
{{- if ne $mode "podIdentity" }}
{{- fail (printf "awsWriters.%s needs aws.identity podIdentity: a writer store assumes a writer role with the controller's own credentials, and a webIdentity cluster has none; the exception to reader-only stores exists for the one mode whose admission policy can pin it" $w.name) }}
{{- end }}
{{- if not $w.region }}
{{- fail (printf "awsWriters.%s needs region — the region of the parameters it writes" $w.name) }}
{{- end }}
{{- if not $w.role }}
{{- fail (printf "awsWriters.%s needs role — the writer role in the parameters' account" $w.name) }}
{{- end }}
{{- if not $w.prefix }}
{{- fail (printf "awsWriters.%s needs prefix — the one parameter path it may write; a writer store without one is pinned to nothing" $w.name) }}
{{- end }}
{{- if or (not (hasPrefix "/" $w.prefix)) (not (hasSuffix "/" $w.prefix)) (eq (trim (trimAll "/" $w.prefix)) "") (contains "*" $w.prefix) (contains "//" $w.prefix) }}
{{- fail (printf "awsWriters.%s.prefix %q must start and end with \"/\", name at least one segment, and have no wildcard or empty segment" $w.name $w.prefix) }}
{{- end }}
{{- range $r := $.Values.awsStores }}
{{- if eq $r.role $w.role }}
{{- fail (printf "awsWriters.%s uses the role of awsStores.%s: a writer role is not a reader's, or the reader store could write" $w.name $r.name) }}
{{- end }}
{{- end }}
{{- include "consumers.claim" (dict "registry" $registry "kind" "ClusterSecretStore" "name" $w.name "by" (printf "awsWriters.%s" $w.name)) }}
{{- include "consumers.requireConditions" (dict "conditions" $w.conditions "by" (printf "awsWriters.%s" $w.name)) }}
{{- if ne (len $w.conditions) 1 }}
{{- fail (printf "awsWriters.%s needs exactly one condition naming its namespaces" $w.name) }}
{{- end }}
{{- if not (index $w.conditions 0).namespaces }}
{{- fail (printf "awsWriters.%s: the condition must list namespaces by name (no selector, no regex)" $w.name) }}
{{- end }}
---
{{- /* A writer store: the one exception to "AWS stores read". It assumes the
       writer role of its grant with the controller's own credentials, as a
       reader store does, and is pinned to one prefix, which ESO puts in front
       of every remoteKey (reads and pushes alike). The admission policy admits
       exactly this shape. docs/esoaws.md#writer-stores. */}}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ $w.name }}
  {{- with include "consumers.annotations" (dict "root" $ "extra" $w.annotations) | fromYaml }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  conditions:
    {{- toYaml $w.conditions | nindent 4 }}
  provider:
    aws:
      service: ParameterStore
      region: {{ $w.region | quote }}
      role: {{ $w.role | quote }}
      prefix: {{ $w.prefix | quote }}
{{- end }}
