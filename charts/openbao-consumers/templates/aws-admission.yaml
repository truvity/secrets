{{- /* The admission policy that keeps External Secrets' own AWS identity
       to the stores this release renders. In podIdentity mode the
       controller holds credentials that may assume every reader role on
       the cluster, and External Secrets uses them for any AWS object that
       names no auth of its own: a namespaced SecretStore, or an ECR or STS
       generator (namespaced, or wrapped in a ClusterGenerator). With
       `role` set to a reader's ARN, such an object reads that grant's
       parameters from any namespace. This policy refuses those objects,
       any ClusterSecretStore on the aws provider this release does not
       render, and any of the release's own that has drifted from what it
       renders. On by default in podIdentity mode, and weakening it there
       takes an explicit acknowledgement; docs/esoaws.md#the-admission-policy. */}}
{{- $p := .Values.aws.admissionPolicy }}
{{- $mode := .Values.aws.identity }}
{{- $pod := eq $mode "podIdentity" }}
{{- $on := $pod }}
{{- if kindIs "bool" $p.enabled }}{{- $on = $p.enabled }}{{- end }}
{{- if and $pod (not $p.acknowledgeTenantsCanBorrowControllerIdentity) }}
{{- $weakened := list }}
{{- if not $on }}{{- $weakened = append $weakened "enabled: false" }}{{- end }}
{{- if not (has "Deny" $p.validationActions) }}{{- $weakened = append $weakened (printf "validationActions %v without Deny" $p.validationActions) }}{{- end }}
{{- if eq $p.failurePolicy "Ignore" }}{{- $weakened = append $weakened "failurePolicy: Ignore" }}{{- end }}
{{- if $weakened }}
{{- fail (printf "aws.admissionPolicy is weakened (%s) while aws.identity is podIdentity — without the policy, anyone who may create a SecretStore can borrow the External Secrets controller's AWS identity and read any grant on this cluster; set aws.admissionPolicy.acknowledgeTenantsCanBorrowControllerIdentity: true to accept that" (join ", " $weakened)) }}
{{- end }}
{{- end }}
{{- if $on }}
{{- $name := $p.name | default (printf "%s-aws-stores" .Release.Name) }}
{{- /* What each of the release's stores may say, by name: the role in
       podIdentity mode, the ServiceAccount in webIdentity mode. */}}
{{- $expected := dict }}
{{- range .Values.awsStores }}
{{- if $pod }}
{{- $_ := set $expected .name (dict "role" .role) }}
{{- else }}
{{- $ref := dig "jwt" "serviceAccountRef" dict (.auth | default dict) }}
{{- $_ := set $expected .name (dict "sa" ($ref.name | default "") "ns" ($ref.namespace | default "")) }}
{{- end }}
{{- end }}
{{- /* The release's writer stores (awsWriters, podIdentity only): the one
       exception to reader-only stores. Each is pinned to its role, region
       and prefix as well, and to the ParameterStore service; the readers
       above are pinned to their role and to no prefix at all. */}}
{{- range .Values.awsWriters }}
{{- $_ := set $expected .name (dict "role" .role "region" .region "prefix" .prefix) }}
{{- end }}
{{- /* "Names auth of its own" for an object whose auth sits under P: a
       Secret or a ServiceAccount. An absent auth and an empty one are the
       same to External Secrets: its controller's own credentials. */}}
{{- $own := "(has(%[1]s.auth) && (has(%[1]s.auth.secretRef) || has(%[1]s.auth.jwt)))" }}
{{- $ecr := "variables.obj.spec.generator.ecrAuthorizationTokenSpec" }}
{{- $sts := "variables.obj.spec.generator.stsSessionTokenSpec" }}
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: {{ $name }}
  {{- with $p.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- /* An earlier sync wave by default: the policy holds what each of the
         release's stores may say, so it must change before they do. The
         policy's own annotations override it. */}}
  {{- $extra := mergeOverwrite (dict "argocd.argoproj.io/sync-wave" "-1") ($p.annotations | default dict) }}
  {{- $an := include "consumers.annotations" (dict "root" $ "extra" $extra) }}
  {{- if ne $an "{}" }}
  annotations:
    {{- $an | nindent 4 }}
  {{- end }}
spec:
  failurePolicy: {{ $p.failurePolicy }}
  matchConstraints:
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["*"]
        resources: ["secretstores", "clustersecretstores"]
        operations: ["CREATE", "UPDATE"]
      - apiGroups: ["generators.external-secrets.io"]
        apiVersions: ["*"]
        resources: ["ecrauthorizationtokens", "stssessiontokens", "clustergenerators"]
        operations: ["CREATE", "UPDATE"]
  matchConditions:
    # An update to an object already being deleted that leaves its spec as
    # it was (a finalizer's removal) is not judged, so a deletion cannot be
    # wedged. Every other update is: an object held in deletion by a
    # finalizer is still read by External Secrets, so a spec change while
    # it waits is judged like any other.
    - name: not-a-finalizer-release
      expression: >-
        !(request.operation == 'UPDATE' && has(dyn(oldObject).metadata.deletionTimestamp) &&
        dyn(object).spec == dyn(oldObject).spec)
  variables:
    - name: obj
      expression: 'dyn(object)'
    - name: kind
      expression: 'request.kind.kind'
    # Cluster-scoped kinds have no namespace to name.
    - name: subject
      expression: >-
        variables.kind + ' ' + variables.obj.metadata.name +
        (variables.kind == 'ClusterSecretStore' || variables.kind == 'ClusterGenerator' ? '' :
        ' in namespace ' + request.namespace)
    - name: isStore
      expression: "variables.kind == 'SecretStore' || variables.kind == 'ClusterSecretStore'"
    - name: onAWS
      expression: >-
        variables.isStore && has(variables.obj.spec.provider) && has(variables.obj.spec.provider.aws)
    - name: aws
      expression: "variables.onAWS ? variables.obj.spec.provider.aws : {}"
    - name: storeOwnAuth
      expression: {{ printf $own "variables.aws" | quote }}
    # A generator that would act with the controller's credentials: a
    # namespaced ECR or STS generator, or a ClusterGenerator wrapping one.
    - name: generatorBorrows
      expression: >-
        (variables.kind == 'ECRAuthorizationToken' || variables.kind == 'STSSessionToken') ?
        !{{ printf $own "variables.obj.spec" }} :
        variables.kind == 'ClusterGenerator' && has(variables.obj.spec.generator) && (
        (has({{ $ecr }}) && !{{ printf $own $ecr }}) ||
        (has({{ $sts }}) && !{{ printf $own $sts }}))
    - name: expected
      expression: {{ $expected | toJson | squote }}
    - name: releaseStore
      expression: >-
        variables.kind == 'ClusterSecretStore' && variables.onAWS && variables.obj.metadata.name in variables.expected
    # What none of the release's stores says: more roles, a session's tags,
    # an external id.
    - name: extras
      expression: >-
        has(variables.aws.additionalRoles) || has(variables.aws.sessionTags) ||
        has(variables.aws.transitiveTagKeys) || has(variables.aws.externalID)
  validations:
    - expression: "variables.kind != 'SecretStore' || !variables.onAWS || variables.storeOwnAuth"
      messageExpression: >-
        variables.subject + ' is on the aws provider with no auth of its own (secretRef or jwt): External Secrets would use its' +
        ' controller\'s AWS identity, which may assume this cluster\'s parameter reader roles'
      reason: Forbidden
    - expression: "!variables.generatorBorrows"
      messageExpression: >-
        variables.subject + ' names no auth of its own (secretRef or jwt) for AWS: External Secrets would use its controller\'s AWS identity'
      reason: Forbidden
    - expression: "variables.kind != 'ClusterSecretStore' || !variables.onAWS || variables.releaseStore"
      messageExpression: >-
        variables.subject +
        ' is on the aws provider but is not one of the stores release {{ .Release.Name }} renders (awsStores):' +
        ' every namespace its conditions admit would read with the controller\'s AWS identity'
      reason: Forbidden
    {{- if $pod }}
    # podIdentity: the release's store reads as the controller, assuming its
    # one rendered role and nothing else.
    - expression: >-
        !variables.releaseStore || (!variables.extras && !has(variables.aws.auth) &&
        has(variables.aws.role) && variables.aws.role == variables.expected[variables.obj.metadata.name].role)
      messageExpression: >-
        variables.subject + ' is release {{ .Release.Name }}\'s, but differs from what it renders: it assumes exactly ' +
        variables.expected[variables.obj.metadata.name].role +
        ', with no auth, additionalRoles, sessionTags, transitiveTagKeys or externalID'
      reason: Forbidden
    # A reader store carries no prefix (the chart renders none), and a writer
    # store carries exactly its rendered one, in its rendered region, on the
    # Parameter Store service: the path a writer role is scoped to is the path
    # its store is pinned to.
    - expression: >-
        !variables.releaseStore || ('prefix' in variables.expected[variables.obj.metadata.name] ?
        (has(variables.aws.prefix) && variables.aws.prefix == variables.expected[variables.obj.metadata.name].prefix &&
        has(variables.aws.region) && variables.aws.region == variables.expected[variables.obj.metadata.name].region &&
        has(variables.aws.service) && variables.aws.service == 'ParameterStore') :
        !has(variables.aws.prefix))
      messageExpression: >-
        variables.subject + ' is release {{ .Release.Name }}\'s, but differs from what it renders: ' +
        ('prefix' in variables.expected[variables.obj.metadata.name] ?
        'a writer store is pinned to exactly the prefix ' + variables.expected[variables.obj.metadata.name].prefix +
        ' in region ' + variables.expected[variables.obj.metadata.name].region + ' on Parameter Store' :
        'a reader store carries no prefix')
      reason: Forbidden
    {{- else }}
    # webIdentity: the release's store reads as its one rendered
    # ServiceAccount, and assumes nothing on top.
    - expression: >-
        !variables.releaseStore || (!variables.extras && !has(variables.aws.role) &&
        has(variables.aws.auth) && !has(variables.aws.auth.secretRef) && has(variables.aws.auth.jwt) &&
        variables.aws.auth.jwt.serviceAccountRef.name == variables.expected[variables.obj.metadata.name].sa &&
        has(variables.aws.auth.jwt.serviceAccountRef.namespace) &&
        variables.aws.auth.jwt.serviceAccountRef.namespace == variables.expected[variables.obj.metadata.name].ns &&
        !has(variables.aws.auth.jwt.serviceAccountRef.audiences))
      messageExpression: >-
        variables.subject + ' is release {{ .Release.Name }}\'s, but differs from what it renders: it reads as ServiceAccount ' +
        variables.expected[variables.obj.metadata.name].ns + '/' + variables.expected[variables.obj.metadata.name].sa +
        ' only, with no role, secretRef, audiences, additionalRoles, sessionTags, transitiveTagKeys or externalID'
      reason: Forbidden
    {{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: {{ $name }}
  {{- with $p.labels }}
  labels:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  {{- if ne $an "{}" }}
  annotations:
    {{- $an | nindent 4 }}
  {{- end }}
spec:
  policyName: {{ $name }}
  validationActions:
    {{- toYaml $p.validationActions | nindent 4 }}
{{- end }}
