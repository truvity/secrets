# openbao-consumers — the cluster side of an OpenBAO install.
#
# Runs on every cluster that CONSUMES an OpenBAO: the stores that read
# secrets from it, the stores that write back to it, and the cert-manager
# issuers, trust anchors, bundle and certificates that make its PKI usable.
# The server is elsewhere (openbao-ops, beside it).
#
# Everything particular — the endpoint, the CA, namespaces, role names,
# which workloads may read what — is an input. The chart supplies the
# shapes that are easy to get subtly wrong and hard to notice when you do.
#
# Stores and PKI are independent: an install may render either or both,
# which lets them sit in different deployments with their own ordering.

# Added to every object this chart renders. Per-object `annotations` are
# merged over it.
commonAnnotations: {}

# The OpenBAO endpoint, e.g. https://openbao.example.internal:8200
server: ""

# Base64 PEM of the CA that signed the SERVER's certificate. This verifies
# the endpoint a client is about to send a token to — it is not the root
# that verifies certificates OpenBAO issues, and the two are usually
# different authorities. Required whenever a store or an issuer renders.
caBundle: ""

# The OpenBAO namespace these objects address. Empty on an install with no
# namespaces.
vaultNamespace: ""

# The KV v2 mount every store reads from and writes to.
kvMount: kv

# Appended to a reader store's name, so a store on the Vault provider is
# distinguishable from a same-named one on another provider during a
# migration between the two.
storeSuffix: openbao

auth:
  # The JWT auth mount workloads on this cluster log in to. A mount is per
  # cluster, so estates usually name it after the cluster.
  mountPath: jwt
  # The audience the mount requires. A token minted for this audience
  # cannot be replayed against the Kubernetes API.
  audience: openbao
  # Ten minutes: long enough for a login, worth almost nothing if leaked.
  expirationSeconds: 600
  # The identity External Secrets itself presents, for reader stores.
  serviceAccount:
    name: external-secrets
    namespace: external-secrets

# A writer store presents its OWN ServiceAccount token instead, so nothing
# else on the cluster can write through it. The auth mount is this
# cluster's (empty: auth.mountPath); the Vault namespace is the target
# environment's.
writerAuthMount: ""

# Reader stores, one per kind. `role` defaults to the name, so the OpenBAO
# policy that bounds what a store may read is findable from the store.
stores: []
#  - name: example-app
#    role: example-app
#    vaultNamespace: ""          # default: the top-level vaultNamespace
#    annotations: {}
#    conditions:                 # required: without it every namespace can read
#      - namespaces: [example-app]

writers: []
#  - name: example-writer
#    namespace: example-system   # where its ServiceAccount lives
#    serviceAccount: openbao-writer
#    environments: [devel, prod] # one store per environment
#    annotations: {}

# External Secrets on AWS Systems Manager Parameter Store, in an account
# that need not be the cluster's. pkg/esoaws makes the roles on both sides;
# docs/esoaws.md walks the chain. Nothing here needs `server` or `caBundle`.
aws:
  # How External Secrets on this cluster proves who it is to AWS. Required
  # with awsStores; no default. One mode per cluster: they are mutually
  # exclusive, because a controller identity beside per-store identities is
  # one any store without auth borrows.
  #   podIdentity  the controller holds its own credentials (EKS Pod
  #                Identity) and assumes each store's `role`; stores name
  #                no auth.
  #   webIdentity  nothing holds credentials; each store names its own
  #                ServiceAccount (auth.jwt.serviceAccountRef), whose token
  #                assumes the role through the cluster's OIDC issuer.
  identity: ""
  webIdentity:
    # The audience the reader roles require (esoaws WebIdentity.Audience),
    # set on each ServiceAccount this chart renders.
    audience: sts.amazonaws.com
  # A ValidatingAdmissionPolicy (Kubernetes 1.30+) that refuses what would
  # borrow the controller's AWS identity: a namespaced SecretStore, an ECR or
  # STS generator, or a ClusterGenerator wrapping one, on AWS with no auth of
  # its own; a ClusterSecretStore on AWS that is not one of this release's
  # awsStores; and one of the release's that has drifted from what it
  # renders. Empty (null): on in podIdentity mode, off otherwise.
  admissionPolicy:
    enabled: null
    name: ""                  # default: <release>-aws-stores
    labels: {}
    # On the policy and its binding, merged over commonAnnotations and over
    # the default argocd.argoproj.io/sync-wave: "-1". The policy holds what
    # each store may say, so it must be applied before the stores: keep its
    # wave below theirs.
    annotations: {}
    validationActions: [Deny] # [Warn, Audit] is the dry run
    failurePolicy: Fail
    # In podIdentity mode the policy is what stops tenants borrowing the
    # controller's identity, so turning it off, dropping Deny or ignoring
    # its failures there fails the render unless this is true.
    acknowledgeTenantsCanBorrowControllerIdentity: false

# Stores on Parameter Store: one per (cluster, grant), named as given, no
# suffix. `role` is the grant's reader role (esoaws Readers.RoleARNs).
awsStores: []
#  - name: example-app-config
#    region: eu-example-1
#    role: arn:aws:iam::444455556666:role/example-app-config
#    annotations: {}
#    conditions:                 # required: without it every namespace can read
#      - namespaces: [example-app]
#    # webIdentity only, and required there; refused in podIdentity:
#    auth:
#      jwt:
#        serviceAccountRef:
#          name: example-app-config      # the grant's esoaws ServiceAccount
#          namespace: external-secrets   # required: only administrators
#                                        # create objects here
#    serviceAccount:             # webIdentity only: render that ServiceAccount
#      create: true              # false: you provide it, annotated
#                                # eks.amazonaws.com/role-arn: <role>
#      annotations: {}

# Writer stores on Parameter Store: the narrow exception to "the stores are
# readers". PodIdentity mode only. A writer store is a ClusterSecretStore that
# assumes a WRITER role (esoaws NewWriters) and is meant for PushSecrets: the
# role may write, and read, only the parameters under `prefix`, and the store
# pins the same prefix, so a PushSecret's remoteKey is relative to it. The
# admission policy admits exactly the writer stores listed here, pinned to
# their role, region and prefix, and no other. Each is usable from the one
# namespace it names. The role must not be a reader's (an awsStores role).
awsWriters: []
#  - name: example-app-client-push
#    region: eu-example-1
#    role: arn:aws:iam::444455556666:role/a-eso-app-client-writer
#    prefix: /example/app/client/       # starts and ends with "/"
#    annotations: {}
#    conditions:                        # exactly one entry, one or more namespace names
#      - namespaces: [example-app]

pki:
  enabled: false
  # On the objects cert-manager's login is made of (the ServiceAccount, its
  # token Role and RoleBinding) and on the trust anchors.
  annotations: {}

  certManager:
    namespace: cert-manager
    # cert-manager's own identity, which mints the issuers' tokens.
    serviceAccountName: cert-manager
  # The identity cert-manager presents to OpenBAO. It holds no token:
  # cert-manager mints one per request, so there is none to rotate.
  issuerServiceAccount: openbao-issuer
  # Default for every issuer: the top-level vaultNamespace when empty.
  vaultNamespace: ""
  # The auth mount cert-manager's issuers log in on. Empty: auth.mountPath,
  # the mount the stores use. Set it when the issuers sign in a namespace
  # whose mount is named differently from the stores'.
  authMountPath: ""

  # The ROOTS that verify what OpenBAO issues, one ConfigMap each in
  # certManager.namespace, and every one of them in the bundle. Public
  # certificates only: the keys never leave their custody.
  trustAnchors: []
  #  - name: example-root-2026
  #    certificate: <base64 PEM>
  #    labels: {}
  #    annotations: {}
  # The key each anchor's ConfigMap holds its certificate under.
  rootKey: ca.crt

  # cert-manager issuers backed by OpenBAO: one per signing path. A Vault
  # issuer's path is fixed, so a second chain or a second role is a second
  # issuer, not a change to the first.
  issuers: []
  #  - name: example-private
  #    kind: ClusterIssuer          # ClusterIssuer | Issuer
  #    signPath: pki/sign/example   # the OpenBAO role that bounds what it signs
  #    role: example-private        # the auth role cert-manager logs in as
  #    audiences: []                # extra token audiences for that login
  #    vaultNamespace: ""           # default: pki.vaultNamespace
  #    annotations: {}

  bundle:
    enabled: true
    name: openbao-private-ca
    annotations: {}
    # Sources placed BEFORE the trust anchors — during a root migration,
    # the OLD root. Trusting both is what lets leaves be reissued in any
    # order instead of on a flag day.
    extraSources: []
    target:
      key: ca-certificates.crt
      namespaceSelector: {}       # {} — every namespace

  # More Bundles, alongside `bundle` (which stays as it is, and may be turned
  # off): each with its own sources, target key and namespaceSelector. For a
  # trust of a different audience than the private CA — say an identity
  # chain, delivered to the namespaces that opt in by label, and the same
  # chain to one namespace by name (a selector matches a label OR a name,
  # not both). Rendered in order, nothing derived from trustAnchors.
  bundles: []
  #  - name: example-identity-ca        # unique, and not `bundle.name`
  #    annotations: {}                  # on the Bundle, e.g. a sync-options
  #                                     # annotation of a GitOps controller
  #    sources:                         # in order; each an inline PEM
  #      - inLine: |
  #          -----BEGIN CERTIFICATE-----
  #          ...
  #    target:
  #      key: example-identity-ca.pem   # the ConfigMap key in each namespace
  #      namespaceSelector:             # required; {} is every namespace
  #        matchLabels:
  #          example.com/identity: "true"

certificateDefaults:
  # A third of the lifetime: renewal gets two chances before anything
  # expires, so an outage in the issuer is survivable rather than immediate.
  duration: 720h
  renewBefore: 240h
  privateKey:
    algorithm: ECDSA
    size: 384
    rotationPolicy: Always

# Certificates from an OpenBAO-backed issuer — typically one disposable
# smoke certificate per issuer, which proves the login, the chain and the
# renewal path before any workload changes its issuerRef.
certificates: []
#  - name: smoke
#    namespace: cert-manager      # default: pki.certManager.namespace
#    commonName: smoke.example.internal
#    dnsNames: []                 # default: [commonName]
#    secretName: ""               # default: <name>-tls
#    issuerRef: {}                # default: the first of pki.issuers
#    duration / renewBefore / privateKey: default certificateDefaults
#    annotations: {}
#    labels: {}

# The approver layer, OPTIONAL and OFF. cert-manager ships a built-in
# "blanket" approver that approves every CertificateRequest for an issuer it
# knows, which turns a certificate's identity into decoration: any account
# that may create a CertificateRequest gets whatever names it asks for.
# Switching it off (cert-manager's `--controllers=*,-certificaterequests-approver`)
# needs something else to approve: approver-policy, driven by the
# CertificateRequestPolicy objects this section renders, one per issuer the
# chart creates, and the RBAC that lets cert-manager `use` them. See
# docs/approver.md for the order to do it in and the proof.
#
# Enabling this requires approver-policy to be installed, with each
# rendered issuer's signer name in its `app.approveSignerNames`:
#   clusterissuers.cert-manager.io/<name>   for kind ClusterIssuer
#   issuers.cert-manager.io/<name>          for kind Issuer
# (or `issuers.cert-manager.io/*` when namespacedIssuers.enabled).
#
# The SPIFFE identity issuer (pki.issuers[].identity: true) is NEVER given a
# policy and its signer name must NOT be in approveSignerNames:
# csi-driver-spiffe's own approver owns it, and it is the only thing that
# checks a workload asks for its OWN identity. Handing that signer to
# approver-policy would either leave it unapproved or approve any URI the
# policy allows, and the policy has no notion of "the requester's own
# ServiceAccount".
approverPolicy:
  enabled: false
  annotations: {}
  # The ClusterRole and ClusterRoleBinding that grant `use`. Default:
  # <release>-approver-use.
  roleName: ""
  # Who creates the CertificateRequests: cert-manager's controller, for
  # every Certificate. Empty means the ServiceAccount named by
  # pki.certManager. csi-driver-spiffe's requests come from a workload's own
  # ServiceAccount and need no entry here, by design.
  requesters: []
  #  - kind: ServiceAccount
  #    name: cert-manager
  #    namespace: cert-manager
  # Constraints every policy gets unless its issuer overrides them. The key
  # is ECDSA, 256 to 384 bits: P-384 is the chart's own default
  # (certificateDefaults.privateKey.size), and OpenBAO's leaf roles accept
  # P-256 as well, so a certificate that still asks for P-256 is not
  # stranded mid-migration. Tighten to minSize: 384 once none does.
  defaults:
    minDuration: 1h
    maxDuration: 2160h
    privateKey:
      algorithm: ECDSA
      minSize: 256
      maxSize: 384
  # One entry per non-identity issuer in pki.issuers, keyed by its name: the
  # shapes its certificates may take. Every value is a glob (`*` only).
  # approver-policy DENIES a request field the policy does not name, so an
  # issuer with no entry is a render error (a policy that names nothing
  # would refuse every request), and so is an entry that names no
  # commonName, dnsNames, uris, ipAddresses or emailAddresses.
  issuers: {}
  #  example-private:
  #    dnsNames: ["*.east.example.internal"]
  #    uris: []
  #    commonName: ""          # allowed value; empty: none allowed
  #    ipAddresses: []
  #    emailAddresses: []
  #    usages: []              # omit: a request that sets usages is denied
  #    minDuration / maxDuration / privateKey: override `defaults`
  # ONE allow-all policy for every namespaced Issuer (kind Issuer, any
  # namespace). A namespaced selfSigned or CA Issuer confers no trust
  # outside its own namespace: whoever can create it already holds its key,
  # so approving its requests grants nothing they did not have. Needed for
  # tenants that mint their own Issuers under a fresh name, which no exact
  # policy can name in advance. NOT for issuers backed by OpenBAO.
  namespacedIssuers:
    enabled: false
    name: namespaced-issuers
  # Policies for issuers that are NOT in pki.issuers: a SelfSigned or CA
  # Issuer, or a ClusterIssuer backed by something other than OpenBAO (a
  # per-database CA, a bootstrap self-signer). Written out as given: no
  # `defaults`, no allow-all; a field the policy does not name is refused.
  # Each entry gets its own ClusterRole and binding for `use`, named
  # <roleName>-<name> (or `roleName` here), for the same requesters.
  # `syncWave` (optional) puts the policy at that wave and its role and
  # binding one wave earlier, so the grant exists before the policy.
  # Default empty: the render is unchanged.
  extraPolicies: []
  #  - name: example-db-ca
  #    issuerRef: {group: cert-manager.io, kind: Issuer, name: example-db-ca}
  #    selector:
  #      namespace: {matchNames: [example-db]}   # or matchLabels
  #    allowed:
  #      commonName: {value: example-db, required: true}
  #      # dnsNames / uris / ipAddresses / emailAddresses: {values: [...], required: false}
  #      isCA: false
  #      usages: [digital signature, key encipherment]
  #    constraints:
  #      privateKey: {algorithm: ECDSA, minSize: 256, maxSize: 384}
  #      minDuration: 1h
  #      maxDuration: 2160h
  #    syncWave: 32
  #    annotations: {}
  #    roleName: ""

# Alerts for the issuance chain, OFF by default. When certificate issuance
# breaks nothing fails loudly: a workload just stops getting a certificate,
# or keeps an old one until it expires. This section ships the rules that
# notice, so each consumer does not write its own. See docs/trust/issuance.md
# ("Alerts") for what each rule reads, which metrics it needs and the gaps.
#
# Every rule reads metrics the cluster's monitoring already has:
# cert-manager's own (`certmanager_certificate_*`), kube-state-metrics'
# workload status (`kube_daemonset_*`, `kube_deployment_*`), and, for the
# two opt-in rules, a metric you export yourself.
alerts:
  enabled: false
  # vmrule         VMRule (operator.victoriametrics.com/v1beta1)
  # prometheusrule PrometheusRule (monitoring.coreos.com/v1)
  # configmap      the plain Prometheus rules file, under one key, for a
  #                ruler that loads files
  format: vmrule
  # Object name. Default: <release>-issuance-alerts.
  name: ""
  # Where the object lives. Default: the release namespace.
  namespace: ""
  # Labels on the OBJECT (an operator's ruleSelector matches these) and
  # annotations on it (merged over commonAnnotations).
  labels: {}
  annotations: {}
  # Labels added to EVERY rule, for routing (a `team`, a `release`). A rule's
  # own `labels` are merged over these; `severity` is set per rule.
  ruleLabels: {}
  # The rule group's name, and its evaluation interval (empty: the ruler's).
  groupName: openbao-issuance
  interval: ""
  # Which cert-manager Certificates the certificate rules look at, as
  # regular expressions over the `namespace` and `name` labels of
  # cert-manager's metrics. Empty: every Certificate the cluster has.
  selector:
    namespaceRegex: ""
    nameRegex: ""
  # The namespace cert-manager, csi-driver-spiffe and approver-policy run
  # in, for the workload rules. Default: pki.certManager.namespace.
  workloadNamespace: ""

  # Per rule: `enabled`, `for` (how long the condition must hold), `severity`,
  # `labels` and `annotations` (merged over the rule's), and the threshold
  # the rule has.
  rules:
    # A Certificate that is not Ready: a first issuance that never
    # finishes, or an expired one. A request stuck Pending (issuer not
    # ready, approval never given) and a request the approver DENIED both
    # end here, because cert-manager exports no CertificateRequest metric.
    certificateNotReady:
      enabled: true
      for: 30m
      severity: warning
      labels: {}
      annotations: {}
    # A CertificateRequest denied by an approver. cert-manager and
    # approver-policy export no metric for it; this rule reads one that
    # kube-state-metrics' custom resource state produces from the
    # CertificateRequest condition (docs/trust/issuance.md has the
    # configuration), so it is opt-in.
    certificateRequestDenied:
      enabled: false
      for: 5m
      severity: critical
      # The metric, and the label it puts the condition type under. It must
      # be 1 while the condition's status is True.
      metric: kube_customresource_certificaterequest_condition
      typeLabel: type
      labels: {}
      annotations: {}
    # csi-driver-spiffe's driver DaemonSet or its approver Deployment has
    # unavailable replicas: workloads on those nodes get no identity.
    csiDriverSpiffeUnavailable:
      enabled: true
      for: 10m
      severity: critical
      daemonSetRegex: cert-manager-csi-driver-spiffe
      deploymentRegex: cert-manager-csi-driver-spiffe-approver
      labels: {}
      annotations: {}
    # approver-policy's Deployment has unavailable replicas: every request
    # for an issuer it owns stays Pending. Default: on with
    # approverPolicy.enabled, off otherwise (empty).
    approverPolicyUnavailable:
      enabled: null
      for: 10m
      severity: critical
      deploymentRegex: cert-manager-approver-policy
      labels: {}
      annotations: {}
    # A Certificate ends soon: it should have been renewed long ago (this
    # chart's certificateDefaults renew ten days before the end), so fewer
    # than `thresholdSeconds` left means renewal has been failing.
    certificateExpiringSoon:
      enabled: true
      for: 15m
      severity: warning
      thresholdSeconds: 604800   # 7 days
      labels: {}
      annotations: {}
    # A Certificate's renewal time passed `graceSeconds` ago and it has not
    # been renewed. Fires days before ExpiringSoon: it is the first sign.
    certificateRenewalOverdue:
      enabled: true
      for: 15m
      severity: warning
      graceSeconds: 7200         # 2 hours: cert-manager's own retry backoff tops out well below
      labels: {}
      annotations: {}
    # An issuing or identity CA ends soon. The CAs live in OpenBAO, and
    # cert-manager holds no Certificate for them, so nothing of cert-manager's
    # can tell. This rule reads the not-after timestamp of the CA
    # certificates from whatever exports it (default: x509-certificate-
    # exporter over the trust-anchor ConfigMaps and the bundle), so it is
    # opt-in. `matchers` is a PromQL label matcher list that selects the CA
    # series, e.g. `secret_namespace="cert-manager"`.
    caExpiring:
      enabled: false
      for: 1h
      severity: critical
      metric: x509_cert_not_after
      matchers: ""
      thresholdSeconds: 2592000  # 30 days
      labels: {}
      annotations: {}
    # cert-manager's metrics are gone. Every other certificate rule would
    # then stay silent, which reads as healthy.
    metricsAbsent:
      enabled: true
      for: 15m
      severity: warning
      labels: {}
      annotations: {}

# The admission policy for namespaces at mTLS level `enforced`. Level
# `enforced` means nothing if a pod can simply not ask for its workload
# identity, so this ValidatingAdmissionPolicy (admissionregistration.k8s.io/v1,
# Kubernetes 1.30+) refuses, in namespaces that carry the opt-in label:
# a pod (or workload template) that does not mount the identity CSI volume,
# one that runs as the `default` ServiceAccount, and a Service that exposes
# a plaintext port. Off by default; nothing renders until enabled. See
# docs/trust/workload-identity.md#the-admission-policy.
admissionPolicy:
  enabled: false
  # Names of the ValidatingAdmissionPolicy and its binding.
  name: ""                        # default: <release>-mtls-enforced
  labels: {}
  annotations: {}
  # The opt-in: only a namespace carrying key=value is touched. Every other
  # namespace, system ones included, is out of scope, so there is nothing to
  # exempt them from.
  namespaceLabel:
    key: mtls-level
    value: enforced
  # [Deny] refuses. [Warn, Audit] is the dry run: the API server answers
  # with a warning and writes an audit annotation, and refuses nothing.
  validationActions: [Deny]
  # Fail: a policy that cannot be evaluated refuses, it does not wave the
  # request through.
  failurePolicy: Fail
  # Check the workload kinds' pod templates too, so a bad Deployment is
  # refused at `kubectl apply`, not left as a ReplicaSet that never gets a
  # pod. The Pod rule stays on either way, as the backstop for pods made
  # some other way.
  workloads: true
  # A per-object exemption: this annotation with a NON-EMPTY value (the
  # reason) on a Pod, on a workload's pod template, or on a Service exempts
  # that object from every rule. Empty is not an exemption.
  exemptAnnotation: mtls-exempt
  csi:
    # Rule one: every container mounts a volume of this CSI driver.
    enabled: true
    driver: spiffe.csi.cert-manager.io
    # Containers that legitimately have no identity of their own, by name,
    # e.g. a sidecar a mutating webhook injects.
    ignoreContainers: []
  serviceAccount:
    # Rule two: no `default` (or unset) ServiceAccount.
    enabled: true
  services:
    # Rule three: every Service port is TLS.
    enabled: true
    # A port is TLS when its appProtocol, lower-cased, is in this list. A
    # port with no appProtocol is plaintext.
    tlsAppProtocols: [https, tls, grpcs, kubernetes.io/wss]
    # Services (`name`) or single ports (`name/portName`) that may stay
    # plaintext: the ones an edge or gateway fronts, or a metrics port.
    allow: []
    # The same, per Service: this annotation set to "true" on a Service.
    gatewayFrontedAnnotation: gateway-fronted
