bootstrap:
  auth:
    - path: jwt-roster
      discoveryUrl: https://id.example.org
      roles:
        - name: roster
          boundAudiences:
            - openbao
          userClaim: sub
          groupsClaim: groups
          claimMappings:
            email: email
          ttl: 15m
  policies:
    - name: all:openbao:operator
      rules:
        - path: '*'
          capabilities:
            - create
            - read
            - update
            - patch
            - delete
            - list
            - sudo
  groups:
    - name: all:openbao:operator
      policies:
        - all:openbao:operator
      doors:
        - jwt-roster
root:
  kv:
    - path: operators
      description: operators only
  pki:
    - path: pki-example-private
      description: example.private Intermediate CA; signs environment issuing CAs only
      defaultLeaseTtl: 87600h
      maxLeaseTtl: 87600h
      defaultIssuer: example-private-2026-09
      issuers:
        - name: example-private-2026-09
          commonName: example.private Intermediate CA
          organization: Example Org
          keyCurve: P-384
          ttl: 87600h
          maxPathLength: 2
          nameConstraints:
            permittedDnsDomains:
              - example.private
              - cluster.local
            excludedIpRanges:
              - 0.0.0.0/0
              - ::/0
          external: true
    - path: pki-origin
      description: example.net Origin Intermediate CA; signs environment issuing CAs only
      defaultLeaseTtl: 87600h
      maxLeaseTtl: 87600h
      defaultIssuer: example-origin-2026-09
      issuers:
        - name: example-origin-2026-09
          commonName: example.net Origin Intermediate CA
          organization: Example Org
          keyCurve: P-384
          ttl: 87600h
          maxPathLength: 2
          external: true
  auth:
    - path: jwt-ops
      description: tokens minted by cluster ops
      discoveryUrl: https://oidc.example.org/ops
      roles:
        - name: restore-check
          boundAudiences:
            - openbao
          boundSubject: system:serviceaccount:openbao:restore-check
          userClaim: sub
          policies:
            - restore-check
          ttl: 15m
        - name: snapshot
          boundAudiences:
            - openbao
          boundSubject: system:serviceaccount:openbao:snapshot
          userClaim: sub
          policies:
            - snapshot
          ttl: 15m
        - name: root-generation
          boundAudiences:
            - openbao
          boundSubject: system:serviceaccount:openbao:root-generation
          userClaim: sub
          policies:
            - root-generation
          ttl: 15m
        - name: plugin-catalog
          boundAudiences:
            - openbao
          boundSubject: system:serviceaccount:openbao:plugin-catalog
          userClaim: sub
          policies:
            - plugin-catalog
          ttl: 15m
    - path: oidc
      type: oidc
      clientId: openbao-ui
      defaultRole: roster
      discoveryUrl: https://id.example.org
      roles:
        - name: roster
          type: oidc
          boundAudiences:
            - openbao-ui
          userClaim: sub
          groupsClaim: groups
          claimMappings:
            email: email
          allowedRedirectUris:
            - https://bao.example.org/ui/vault/auth/oidc/oidc/callback
          oidcScopes:
            - profile
            - email
          ttl: 15m
  policies:
    - name: restore-check
      rules:
        - path: sys/namespaces
          capabilities:
            - list
        - path: pki-example-private/cert/ca
          capabilities:
            - read
        - path: pki-example-private/issuer/example-private-2026-09/json
          capabilities:
            - read
        - path: pki-origin/cert/ca
          capabilities:
            - read
        - path: pki-origin/issuer/example-origin-2026-09/json
          capabilities:
            - read
        - path: alpha/kv/data/canary
          capabilities:
            - read
        - path: alpha/pki/cert/*
          capabilities:
            - read
        - path: alpha/pki/issue/restore-check
          capabilities:
            - update
        - path: alpha/pki/cert/ca
          capabilities:
            - read
        - path: alpha/pki/issuer/example-private-2026-09-alpha/json
          capabilities:
            - read
        - path: alpha/pki-origin/cert/ca
          capabilities:
            - read
        - path: alpha/pki-origin/issuer/example-origin-2026-09-alpha/json
          capabilities:
            - read
        - path: alpha/pki-identity/cert/ca
          capabilities:
            - read
        - path: alpha/pki-identity/issuer/example-identity-2026-09-alpha-root-signed/json
          capabilities:
            - read
        - path: beta/kv/data/canary
          capabilities:
            - read
        - path: beta/pki/cert/*
          capabilities:
            - read
        - path: beta/pki/issue/restore-check
          capabilities:
            - update
        - path: beta/pki/cert/ca
          capabilities:
            - read
        - path: beta/pki/issuer/example-private-2026-09-beta/json
          capabilities:
            - read
        - path: beta/pki-origin/cert/ca
          capabilities:
            - read
        - path: beta/pki-origin/issuer/example-origin-2026-09-beta/json
          capabilities:
            - read
        - path: ops/kv/data/canary
          capabilities:
            - read
        - path: ops/pki/cert/*
          capabilities:
            - read
        - path: ops/pki/issue/restore-check
          capabilities:
            - update
        - path: ops/pki/cert/ca
          capabilities:
            - read
        - path: ops/pki/issuer/example-private-2026-09-ops/json
          capabilities:
            - read
        - path: ops/pki-origin/cert/ca
          capabilities:
            - read
        - path: ops/pki-origin/issuer/example-origin-2026-09-ops/json
          capabilities:
            - read
    - name: snapshot
      rules:
        - path: sys/storage/raft/snapshot
          capabilities:
            - read
    - name: root-generation
      rules:
        - path: sys/generate-root-token/attempt
          capabilities:
            - read
    - name: plugin-catalog
      rules:
        - path: sys/plugins/catalog/auth/aws
          capabilities:
            - read
            - sudo
  groups:
    - name: all:openbao:operator
      policies:
        - all:openbao:operator
      doors:
        - oidc
namespaces:
  - name: alpha
    kv:
      - path: kv
        description: the alpha secrets
        canary: canary
    pki:
      - path: pki
        description: alpha.example.private Issuing CA; the private chain's leaves in alpha
        defaultLeaseTtl: 720h
        maxLeaseTtl: 2160h
        defaultIssuer: example-private-2026-09-alpha
        issuers:
          - name: example-private-2026-09-alpha
            commonName: alpha.example.private Issuing CA
            organization: Example Org
            keyCurve: P-384
            ttl: 26280h
            maxPathLength: 1
            nameConstraints:
              permittedDnsDomains:
                - alpha.example.private
                - cluster.local
              excludedIpRanges:
                - 0.0.0.0/0
                - ::/0
            signedBy:
              mount: pki-example-private
              issuer: example-private-2026-09
        roles:
          - name: private
            issuer: example-private-2026-09-alpha
            allowedDomains:
              - alpha.example.private
            allowBareDomains: true
            allowSubdomains: true
            allowWildcardCertificates: false
            server: true
            client: true
            keyCurve: P-384
            ttl: 720h
            maxTtl: 2160h
            renewBefore: 240h
          - name: workload
            issuer: example-private-2026-09-alpha
            allowedDomains:
              - svc.cluster.local
            allowBareDomains: false
            allowSubdomains: true
            allowWildcardCertificates: false
            server: true
            client: true
            keyCurve: P-384
            ttl: 720h
            maxTtl: 2160h
            renewBefore: 240h
          - name: restore-check
            issuer: example-private-2026-09-alpha
            allowedDomains:
              - restore-check.alpha.example.private
            allowBareDomains: true
            allowSubdomains: false
            allowWildcardCertificates: false
            server: true
            client: false
            keyCurve: P-384
            ttl: 1h
            maxTtl: 1h
        credentialRoles:
          - name: db-client
            issuer: example-private-2026-09-alpha
            subjectMount: jwt-roster
            cnValidations:
              - email
            server: false
            client: true
            keyCurve: P-384
            ttl: 1h
            maxTtl: 1h
      - path: pki-origin
        description: alpha.example.net Issuing CA; the origin chain's leaves in alpha
        defaultLeaseTtl: 720h
        maxLeaseTtl: 2160h
        defaultIssuer: example-origin-2026-09-alpha
        issuers:
          - name: example-origin-2026-09-alpha
            commonName: alpha.example.net Issuing CA
            organization: Example Org
            keyCurve: P-384
            ttl: 26280h
            maxPathLength: 1
            signedBy:
              mount: pki-origin
              issuer: example-origin-2026-09
        roles:
          - name: origin
            issuer: example-origin-2026-09-alpha
            allowedDomains:
              - '*.alpha.example.net'
            allowBareDomains: true
            allowSubdomains: false
            allowWildcardCertificates: true
            server: true
            client: false
            keyCurve: P-384
            ttl: 720h
            maxTtl: 2160h
            renewBefore: 240h
      - path: pki-identity
        description: alpha.example.private Workload Identity CA; the identity chain's leaves in alpha
        defaultLeaseTtl: 1h
        maxLeaseTtl: 24h
        defaultIssuer: example-identity-2026-09-alpha-root-signed
        issuers:
          - name: example-identity-2026-09-alpha-root-signed
            commonName: alpha.example.private Workload Identity CA
            organization: Example Org
            keyCurve: P-384
            ttl: 26280h
            maxPathLength: 0
            nameConstraints:
              excludedIpRanges:
                - 0.0.0.0/0
                - ::/0
              permittedUriDomains:
                - alpha.example.private
            external: true
        roles:
          - name: identity
            issuer: example-identity-2026-09-alpha-root-signed
            allowedDomains: []
            allowBareDomains: false
            allowSubdomains: false
            allowWildcardCertificates: false
            allowedUriSans:
              - spiffe://alpha.example.private/*
            server: true
            client: true
            keyCurve: P-256
            ttl: 1h
            maxTtl: 24h
            renewBefore: 10m
    ssh:
      - path: ssh
        description: the alpha SSH user CA
        keyType: ed25519
        roles:
          - name: ci
            allowedUsers:
              - builder
            defaultUser: builder
            keyTypes:
              - ed25519
            keyIdFormat: '{{token_display_name}}'
            extensions: []
            forceCommand: builder-serve
            ttl: 1h
            maxTtl: 1h
    sshHost:
      - path: ssh-host
        description: the alpha workers' host CA
        keyType: ed25519
        roles:
          - name: worker
            allowedDomains:
              - builders.example.internal
            allowBareDomains: true
            allowSubdomains: false
            keyTypes:
              - ed25519
            keyIdFormat: '{{token_display_name}}'
            ttl: 24h
            maxTtl: 24h
    auth:
      - path: jwt-alpha
        description: tokens minted by cluster alpha
        discoveryUrl: https://oidc.example.org/alpha
        roles:
          - name: app
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:external-secrets:external-secrets
            userClaim: sub
            policies:
              - eso-app
            ttl: 1h
          - name: runner-a
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:runners:a
            userClaim: sub
            policies:
              - alpha:ssh:ci
            ttl: 15m
          - name: runner-b
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:runners:b
            userClaim: sub
            policies:
              - alpha:ssh:ci
            ttl: 15m
          - name: worker-host
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:builders:worker
            userClaim: sub
            policies:
              - worker-sign
            ttl: 15m
          - name: private-ca
            boundAudiences:
              - openbao-private-ca
            boundSubject: system:serviceaccount:cert-manager:cert-manager
            userClaim: sub
            policies:
              - pki-private-ca
            ttl: 15m
          - name: origin-ca
            boundAudiences:
              - openbao-origin-ca
            boundSubject: system:serviceaccount:cert-manager:cert-manager
            userClaim: sub
            policies:
              - pki-origin-ca
            ttl: 15m
          - name: identity-ca
            boundAudiences:
              - openbao-identity-ca
            boundSubject: system:serviceaccount:cert-manager:cert-manager
            userClaim: sub
            policies:
              - pki-identity-ca
            ttl: 15m
      - path: jwt-ops
        description: tokens minted by cluster ops
        discoveryUrl: https://oidc.example.org/ops
        roles:
          - name: writer
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:platform:writer
            userClaim: sub
            policies:
              - writer
            ttl: 1h
      - path: jwt-roster
        discoveryUrl: https://id.example.org
        roles:
          - name: roster
            boundAudiences:
              - openbao
            userClaim: sub
            groupsClaim: groups
            claimMappings:
              email: email
            ttl: 1h
      - path: oidc
        type: oidc
        clientId: openbao-ui
        defaultRole: roster
        discoveryUrl: https://id.example.org
        roles:
          - name: roster
            type: oidc
            boundAudiences:
              - openbao-ui
            userClaim: sub
            groupsClaim: groups
            claimMappings:
              email: email
            allowedRedirectUris:
              - https://bao.example.org/ui/vault/auth/oidc/oidc/callback
            oidcScopes:
              - profile
              - email
            ttl: 1h
    projects:
      - name: shop
        kv:
          - path: kv
            description: the shop secrets
      - name: team
        kv:
          - path: kv
            description: the team secrets
    policies:
      - name: alpha:db:client
        rules:
          - path: pki/sign/db-client
            capabilities:
              - update
      - name: alpha:openbao:writer
        rules:
          - path: kv/data/*
            capabilities:
              - create
              - delete
              - patch
              - read
              - update
          - path: kv/metadata/*
            capabilities:
              - delete
              - list
              - read
          - path: shop/kv/data/*
            capabilities:
              - create
              - delete
              - patch
              - read
              - update
          - path: shop/kv/metadata/*
            capabilities:
              - delete
              - list
              - read
          - path: team/kv/data/*
            capabilities:
              - create
              - delete
              - patch
              - read
              - update
          - path: team/kv/metadata/*
            capabilities:
              - delete
              - list
              - read
      - name: alpha:shop:approver
        rules:
          - path: shop/kv/data/*
            capabilities:
              - create
              - delete
              - patch
              - read
              - update
          - path: shop/kv/metadata/*
            capabilities:
              - delete
              - list
              - read
      - name: alpha:shop:dba
        rules:
          - path: pki/sign/db-client
            capabilities:
              - update
      - name: alpha:shop:deployer
        rules:
          - path: shop/kv/data/*
            capabilities:
              - create
              - delete
              - patch
              - read
              - update
          - path: shop/kv/metadata/*
            capabilities:
              - delete
              - list
              - read
      - name: alpha:shop:viewer
        rules:
          - path: shop/kv/data/*
            capabilities:
              - read
          - path: shop/kv/metadata/*
            capabilities:
              - list
              - read
      - name: alpha:ssh:ci
        rules:
          - path: ssh/sign/ci
            capabilities:
              - update
            deniedParameters:
              - critical_options
      - name: alpha:team:approver
        rules:
          - path: team/kv/data/*
            capabilities:
              - create
              - delete
              - patch
              - read
              - update
          - path: team/kv/metadata/*
            capabilities:
              - delete
              - list
              - read
      - name: alpha:team:deployer
        rules:
          - path: team/kv/data/*
            capabilities:
              - create
              - delete
              - patch
              - read
              - update
          - path: team/kv/metadata/*
            capabilities:
              - delete
              - list
              - read
      - name: alpha:team:viewer
        rules:
          - path: team/kv/data/*
            capabilities:
              - read
          - path: team/kv/metadata/*
            capabilities:
              - list
              - read
      - name: eso-app
        rules:
          - path: kv/data/app/*
            capabilities:
              - read
          - path: kv/metadata/app/*
            capabilities:
              - list
              - read
      - name: pki-identity-ca
        rules:
          - path: pki-identity/sign/identity
            capabilities:
              - update
      - name: pki-origin-ca
        rules:
          - path: pki-origin/sign/origin
            capabilities:
              - update
      - name: pki-private-ca
        rules:
          - path: pki/sign/private
            capabilities:
              - update
          - path: pki/sign/workload
            capabilities:
              - update
          - path: pki/sign/restore-check
            capabilities:
              - update
      - name: worker-sign
        rules:
          - path: ssh-host/sign/worker
            capabilities:
              - update
      - name: writer
        rules:
          - path: kv/data/apps/*
            capabilities:
              - create
              - read
              - update
          - path: kv/metadata/apps/*
            capabilities:
              - create
              - read
              - update
    groups:
      - name: alpha:db:client
        policies:
          - alpha:db:client
        doors:
          - jwt-roster
          - oidc
      - name: alpha:openbao:writer
        policies:
          - alpha:openbao:writer
        doors:
          - jwt-roster
          - oidc
      - name: alpha:shop:approver
        policies:
          - alpha:shop:approver
        doors:
          - jwt-roster
          - oidc
      - name: alpha:shop:dba
        policies:
          - alpha:shop:dba
        doors:
          - jwt-roster
          - oidc
      - name: alpha:shop:deployer
        policies:
          - alpha:shop:deployer
        doors:
          - jwt-roster
          - oidc
      - name: alpha:shop:viewer
        policies:
          - alpha:shop:viewer
        doors:
          - jwt-roster
          - oidc
      - name: alpha:team:approver
        policies:
          - alpha:team:approver
        doors:
          - jwt-roster
          - oidc
      - name: alpha:team:deployer
        policies:
          - alpha:team:deployer
        doors:
          - jwt-roster
          - oidc
      - name: alpha:team:viewer
        policies:
          - alpha:team:viewer
        doors:
          - jwt-roster
          - oidc
  - name: beta
    kv:
      - path: kv
        description: the beta secrets
        canary: canary
    pki:
      - path: pki
        description: beta.example.private Issuing CA; the private chain's leaves in beta
        defaultLeaseTtl: 720h
        maxLeaseTtl: 2160h
        defaultIssuer: example-private-2026-09-beta
        issuers:
          - name: example-private-2026-09-beta
            commonName: beta.example.private Issuing CA
            organization: Example Org
            keyCurve: P-384
            ttl: 26280h
            maxPathLength: 1
            nameConstraints:
              permittedDnsDomains:
                - beta.example.private
                - cluster.local
              excludedIpRanges:
                - 0.0.0.0/0
                - ::/0
            signedBy:
              mount: pki-example-private
              issuer: example-private-2026-09
        roles:
          - name: private
            issuer: example-private-2026-09-beta
            allowedDomains:
              - beta.example.private
            allowBareDomains: true
            allowSubdomains: true
            allowWildcardCertificates: false
            server: true
            client: true
            keyCurve: P-384
            ttl: 720h
            maxTtl: 2160h
            renewBefore: 240h
          - name: workload
            issuer: example-private-2026-09-beta
            allowedDomains:
              - svc.cluster.local
            allowBareDomains: false
            allowSubdomains: true
            allowWildcardCertificates: false
            server: true
            client: true
            keyCurve: P-384
            ttl: 720h
            maxTtl: 2160h
            renewBefore: 240h
          - name: restore-check
            issuer: example-private-2026-09-beta
            allowedDomains:
              - restore-check.beta.example.private
            allowBareDomains: true
            allowSubdomains: false
            allowWildcardCertificates: false
            server: true
            client: false
            keyCurve: P-384
            ttl: 1h
            maxTtl: 1h
        credentialRoles:
          - name: db-client
            issuer: example-private-2026-09-beta
            subjectMount: jwt-roster
            cnValidations:
              - email
            server: false
            client: true
            keyCurve: P-384
            ttl: 1h
            maxTtl: 1h
      - path: pki-origin
        description: beta.example.net Issuing CA; the origin chain's leaves in beta
        defaultLeaseTtl: 720h
        maxLeaseTtl: 2160h
        defaultIssuer: example-origin-2026-09-beta
        issuers:
          - name: example-origin-2026-09-beta
            commonName: beta.example.net Issuing CA
            organization: Example Org
            keyCurve: P-384
            ttl: 26280h
            maxPathLength: 1
            signedBy:
              mount: pki-origin
              issuer: example-origin-2026-09
        roles:
          - name: origin
            issuer: example-origin-2026-09-beta
            allowedDomains:
              - shop.example.net
            allowBareDomains: true
            allowSubdomains: false
            allowWildcardCertificates: true
            server: true
            client: false
            keyCurve: P-384
            ttl: 720h
            maxTtl: 2160h
            renewBefore: 240h
    ssh:
      - path: ssh
        description: the beta SSH user CA
        keyType: ed25519
        roles:
          - name: user
            allowedUsers:
              - ops
            defaultUser: ops
            keyTypes:
              - ed25519
            keyIdFormat: '{{token_display_name}}'
            extensions:
              - permit-pty
            ttl: 1h
            maxTtl: 1h
    sshHost:
      - path: ssh-host
        description: the beta fleets' host CA
        keyType: ed25519
        roles:
          - name: edge
            allowedDomains:
              - edge.example.net
            allowBareDomains: false
            allowSubdomains: true
            keyTypes:
              - ed25519
            keyIdFormat: '{{token_display_name}}'
            ttl: 24h
            maxTtl: 24h
    auth:
      - path: jwt-beta
        description: tokens minted by cluster beta
        discoveryUrl: https://oidc.example.org/beta
        roles:
          - name: app
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:external-secrets:external-secrets
            userClaim: sub
            policies:
              - eso-app
            ttl: 1h
          - name: private-ca
            boundAudiences:
              - openbao-private-ca
            boundSubject: system:serviceaccount:cert-manager:cert-manager
            userClaim: sub
            policies:
              - pki-private-ca
            ttl: 15m
          - name: origin-ca
            boundAudiences:
              - openbao-origin-ca
            boundSubject: system:serviceaccount:cert-manager:cert-manager
            userClaim: sub
            policies:
              - pki-origin-ca
            ttl: 15m
      - path: jwt-ops
        description: tokens minted by cluster ops
        discoveryUrl: https://oidc.example.org/ops
        roles:
          - name: metrics-reader
            boundAudiences:
              - openbao
            boundSubject: system:serviceaccount:external-secrets:external-secrets
            userClaim: sub
            policies:
              - metrics-reader
            ttl: 1h
      - path: jwt-roster
        discoveryUrl: https://id.example.org
        roles:
          - name: roster
            boundAudiences:
              - openbao
            userClaim: sub
            groupsClaim: groups
            claimMappings:
              email: email
            ttl: 1h
      - path: oidc
        type: oidc
        clientId: openbao-ui
        defaultRole: roster
