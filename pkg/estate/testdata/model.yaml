    pki:
      - path: pki
        description: ops.example.private Issuing CA; the private chain's leaves in ops
        defaultLeaseTtl: 720h
        maxLeaseTtl: 2160h
        defaultIssuer: example-private-2026-09-ops
        issuers:
          - name: example-private-2026-09-ops
            commonName: ops.example.private Issuing CA
            organization: Example Org
            keyCurve: P-384
            ttl: 26280h
            maxPathLength: 1
            nameConstraints:
              permittedDnsDomains:
                - ops.example.private
                - cluster.local
              excludedIpRanges:
                - 0.0.0.0/0
                - ::/0
            signedBy:
              mount: pki-example-private
              issuer: example-private-2026-09
        roles:
          - name: private
            issuer: example-private-2026-09-ops
            allowedDomains:
              - ops.example.private
            allowBareDomains: true
            allowSubdomains: true
            allowWildcardCertificates: false
            server: true
            client: true
            keyCurve: P-384
            ttl: 720h
            maxTtl: 2160h
            renewBefore: 240h
          - name: workload
            issuer: example-private-2026-09-ops
            allowedDomains:
              - svc.cluster.local
            allowBareDomains: false
            allowSubdomains: true
            allowWildcardCertificates: false
            server: true
            client: true
            keyCurve: P-384
            ttl: 720h
            maxTtl: 2160h
            renewBefore: 240h
          - name: restore-check
            issuer: example-private-2026-09-ops
            allowedDomains:
              - restore-check.ops.example.private
            allowBareDomains: true
            allowSubdomains: false
            allowWildcardCertificates: false
            server: true
            client: false
            keyCurve: P-384
            ttl: 1h
            maxTtl: 1h
        credentialRoles:
          - name: db-client
            issuer: example-private-2026-09-ops
            subjectMount: jwt-roster
            cnValidations:
              - email
            server: false
            client: true
            keyCurve: P-384
            ttl: 1h
            maxTtl: 1h
