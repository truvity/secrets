---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openbao-issuer
  namespace: cert-manager

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: example-root-2026
  namespace: cert-manager
data:
  ca.crt: |
    -----BEGIN CERTIFICATE-----
    ZXhhbXBsZS1yb290
    -----END CERTIFICATE-----

---
# Source: openbao-consumers/templates/approver.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openbao-consumers-approver-use
rules:
  - apiGroups: ["policy.cert-manager.io"]
    resources: ["certificaterequestpolicies"]
    verbs: ["use"]
    resourceNames:
      - "example-origin"

---
# Source: openbao-consumers/templates/approver.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: openbao-consumers-approver-use-example-origin-acme
rules:
  - apiGroups: ["policy.cert-manager.io"]
    resources: ["certificaterequestpolicies"]
    verbs: ["use"]
    resourceNames:
      - "example-origin-acme"

---
# Source: openbao-consumers/templates/approver.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-consumers-approver-use
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openbao-consumers-approver-use
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager

---
# Source: openbao-consumers/templates/approver.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: openbao-consumers-approver-use-example-origin-acme
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: openbao-consumers-approver-use-example-origin-acme
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openbao-issuer-token
  namespace: cert-manager
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["openbao-issuer"]
    verbs: ["create"]

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openbao-issuer-token
  namespace: cert-manager
subjects:
  - kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: openbao-issuer-token

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: trust.cert-manager.io/v1alpha1
kind: Bundle
metadata:
  name: openbao-private-ca
spec:
  sources:
    - configMap:
        name: example-root-2026
        key: ca.crt
  target:
    configMap:
      key: ca-certificates.crt
    namespaceSelector:
      {}

---
# Source: openbao-consumers/templates/approver.yaml
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: example-origin
spec:
  selector:
    issuerRef:
      name: "example-origin"
      kind: ClusterIssuer
      group: cert-manager.io
    namespace:
      matchNames:
      - envoy-gateway-system
  allowed:
    dnsNames:
      required: true
      values:
        - '*.example.com'
        - example.com
        - '*.acme.example'
    isCA: false
  constraints:
    minDuration: 1h
    maxDuration: 2160h
    privateKey:
      algorithm: ECDSA
      maxSize: 384
      minSize: 384

---
# Source: openbao-consumers/templates/approver.yaml
apiVersion: policy.cert-manager.io/v1alpha1
kind: CertificateRequestPolicy
metadata:
  name: example-origin-acme
spec:
  selector:
    issuerRef:
      group: cert-manager.io
      kind: ClusterIssuer
      name: example-origin
    namespace:
      matchLabels:
        platform.example.io/vendor: acme
  allowed:
    dnsNames:
      required: true
      values:
      - '*.acme.example'
    isCA: false
  constraints:
    privateKey:
      minSize: 384

---
# Source: openbao-consumers/templates/pki.yaml
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: example-origin
spec:
  vault:
    server: "https://openbao.example.internal:8200"
    namespace: east
    path: pki/sign/origin
    caBundle: "ZXhhbXBsZS1jYQ=="
    auth:
      kubernetes:
        role: example-private
        mountPath: /v1/auth/jwt-east
        serviceAccountRef:
          name: openbao-issuer
