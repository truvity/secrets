# A writer store names its namespaces; a label selector would admit whoever can label a namespace.
aws:
  identity: podIdentity
awsWriters:
  - name: app-push
    region: eu-example-1
    role: arn:aws:iam::444455556666:role/a-writer
    prefix: /app/client/
    conditions:
      - namespaceSelector:
          matchLabels: {push: "true"}
