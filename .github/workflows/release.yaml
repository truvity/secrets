# Tag-triggered release — the shared implementation (truvity/ci-workflows).
# goreleaser makes the GitHub Release with the openbaoctl binaries (see
# .goreleaser.yaml); the tag is the Go module's version as it stands; every
# chart listed below is packaged at the tag's version and pushed to
# oci://ghcr.io/truvity/charts/<chart>.
#
# The caller grants the permissions because a reusable workflow can
# narrow them but never widen them.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

# Never cancel a running publish — a half-pushed artifact set is worse
# than a queued wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: truvity/ci-workflows/.github/workflows/release-public.yaml@8ab8774ba50e3668dcb5a07ad40ec900866ae140 # v3.33.0
    with:
      charts: '["openbao-ops", "openbao-consumers"]'
